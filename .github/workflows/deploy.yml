name: Deploy to EC2

on:
  push:
    branches:
      - master   # 🔥 Or 'main' if your repo uses main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Test SSH Connection (Debug Step)
      run: |
        echo "${{ secrets.EC2_SSH_KEY }}" > key.pem
        chmod 600 key.pem
        ssh -o StrictHostKeyChecking=no -i key.pem ubuntu@${{ secrets.EC2_HOST }} "echo '✅ SSH Connection Successful'" || (echo "❌ SSH Connection Failed" && exit 1)

    - name: Deploy to EC2
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ubuntu
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          set -e
          echo "🔗 SSH connected successfully."

          cd /opt/c8-datalake

          echo "🧹 Cleaning local repo changes..."
          git fetch origin
          git reset --hard origin/master
          git clean -fd

          echo "🔄 Pulling latest code..."
          git pull origin master

          echo "🛑 Stopping Docker containers..."
          sudo docker compose down

          echo "🧽 Pruning Docker resources..."
          sudo docker system prune -af --volumes

          echo "🚀 Building and starting Docker containers..."
          sudo docker compose up -d --build

          echo "☁️ Uploading logs..."
          bash upload-logs.sh

          echo "🧹 Cleaning system..."
          bash clean-docker.sh

          echo "✅ Deployment Complete 🚀"
