services:
  clickhouse:
    image: clickhouse/clickhouse-server:23.8
    container_name: clickhouse-datalake
    ports:
      - "8123:8123"
      - "9000:9000"
    secrets:
      - clickhouse_password
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./clickhouse/config.d:/etc/clickhouse-server/config.d:ro
      - ./clickhouse/users.d:/etc/clickhouse-server/users.d:ro
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        - CMD
        - wget
        - --no-verbose
        - --tries=1
        - --spider
        - http://localhost:8123/ping
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    logging:
      driver: awslogs
      options:
        awslogs-region: us-east-1
        awslogs-group: /docker/containers/clickhouse
        awslogs-stream: clickhouse-datalake

secrets:
  clickhouse_password:
    file: ./secrets/clickhouse_password.txt

volumes:
  clickhouse_data:
